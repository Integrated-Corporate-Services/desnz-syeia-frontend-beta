    <!-- 
      Fix #4: Clickjacking Protection - Framebuster Script
      Defense-in-depth: Break out of iframe if page is framed
      Works even if X-Frame-Options header is stripped by proxy
    -->

      // Framebuster: Prevent clickjacking
      if (top !== self) {
        top.location = self.location;
      }
